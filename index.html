<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Character Counter - Professional Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>

<body>
    <button class="theme-toggle" id="themeToggle" title="Toggle Dark Mode">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-keyboard"></i> Live Character Counter</h1>
            <p>Track your characters in real-time with style</p>
        </div>

        <div class="input-section" id="char">
            <div class="label-container">
                <label id="charLabel">
                    <i class="fas fa-text-width"></i>
                    Enter Your Text
                </label>
                <span class="counter-badge" id="charBadge">0</span>
            </div>
            <input id="charInput" type="text" placeholder="Start typing here..." />
            <div class="action-buttons">
                <button class="btn" id="charCopy" title="Copy to clipboard">
                    <i class="fas fa-copy"></i> Copy
                </button>
                <button class="btn btn-secondary" id="charClear" title="Clear text">
                    <i class="fas fa-trash"></i> Clear
                </button>
            </div>
            <div class="stats-panel" id="charStats">
                <div class="stats-grid">
                    <div class="stats-item">
                        <div class="number" id="charWords">0</div>
                        <span>Words</span>
                    </div>
                    <div class="stats-item">
                        <div class="number" id="charLetters">0</div>
                        <span>Letters</span>
                    </div>
                    <div class="stats-item">
                        <div class="number" id="charNumbers">0</div>
                        <span>Numbers</span>
                    </div>
                    <div class="stats-item">
                        <div class="number" id="charSpecial">0</div>
                        <span>Special</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-section" id="msg">
            <div class="label-container">
                <label id="msgLabel">
                    <i class="fas fa-comment-dots"></i>
                    Express Your Thoughts
                </label>
                <span class="counter-badge success" id="msgBadge">0 / 100</span>
            </div>
            <textarea id="msgInput" placeholder="Share your ideas, thoughts, or messages here..." maxlength="100"></textarea>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
            </div>
            <div class="action-buttons">
                <button class="btn" id="msgCopy" title="Copy to clipboard">
                    <i class="fas fa-copy"></i> Copy
                </button>
                <button class="btn btn-secondary" id="msgClear" title="Clear text">
                    <i class="fas fa-trash"></i> Clear
                </button>
            </div>
            <div class="stats-panel" id="msgStats">
                <div class="stats-grid">
                    <div class="stats-item">
                        <div class="number" id="msgWords">0</div>
                        <span>Words</span>
                    </div>
                    <div class="stats-item">
                        <div class="number" id="msgLetters">0</div>
                        <span>Letters</span>
                    </div>
                    <div class="stats-item">
                        <div class="number" id="msgNumbers">0</div>
                        <span>Numbers</span>
                    </div>
                    <div class="stats-item">
                        <div class="number" id="msgSpecial">0</div>
                        <span>Special</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Action completed!</span>
    </div>

    <script src="style.js"></script>
</body>

</html>
